# GitHub Codespaces: a real SQL Server 2022 next to the editor, all in the browser.
#   app  the editor container (VS Code in the browser, Python)
#   db   SQL Server 2022; the app reaches it at localhost,1433
# The password only protects this private, throw-away container.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "AgriPulse!2026"
    volumes:
      # the project folder, so BULK INSERT can read the prepared data files
      - ..:/agripulse:ro
